# The Worker that gives map links on servenupphotos.net their preview image.
# See docs/map-link-previews.md for how to set it up and deploy it.
name = "servenup-map-previews"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Every request goes through the Worker, since a link with ?photo= can be to any page. Files and
# pages without a preview are passed on to GitHub Pages untouched.
routes = [{ pattern = "servenupphotos.net/*", zone_name = "servenupphotos.net" }]

[vars]
# Where the built portfolio is served, for map-pins.json.
SITE_ORIGIN = "https://servenupphotos.net"

# Where each drawn preview image is kept, so it's drawn once.
[[r2_buckets]]
binding = "PREVIEWS"
bucket_name = "servenup-map-previews"

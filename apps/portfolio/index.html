<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Photography portfolio — coming soon." />
    <title>Serven Up Photos</title>
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash white.
      // Keep the storage key in sync with src/components/theme-provider.tsx.
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("servenup-theme") || "system";
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

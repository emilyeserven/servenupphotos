<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local photo pipeline control panel." />
    <title>Photo Pipeline</title>
    <script>
      // Sets dark mode before the app loads so a dark page doesn't flash light; stores/theme.ts takes over after.
      try {
        const mode = JSON.parse(localStorage.getItem("pipeline-theme"))?.state?.mode ?? "system";
        const dark =
          mode === "dark" ||
          (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

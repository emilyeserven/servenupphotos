version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    # Holds the line at today's most similar code (dupl, 200 tokens); tighten it over time.
    - dupl
    - errorlint
    # Keeps request bodies read in one place: httpapi's respond.go (see the exclusions below).
    - forbidigo
    # Holds the line at today's longest function (SetSocialDates, 76 lines / 51 statements); tighten it over time.
    - funlen
    - gocritic
    # Cyclomatic complexity (one per branch) over 20, the same limit fallow sets for the TypeScript apps.
    # The two functions already over it are listed in the exclusions below; split them to take them off.
    - gocyclo
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    forbidigo:
      forbid:
        - pattern: ^json\.NewDecoder$
          msg: "Read a request's JSON body with withBody, withGitHubBody or decodeEntryUpTo from respond.go."
    dupl:
      threshold: 200
    funlen:
      lines: 80
      statements: 55
    gocyclo:
      min-complexity: 20
  exclusions:
    rules:
      # Tests are long tables of cases; their length and branching are not what these linters guard against.
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - forbidigo
      # Over gocyclo's limit before it was lowered to fallow's: replaceTopLevel (24) and SetSocialDates (21).
      - path: internal/github/social\.go
        linters:
          - gocyclo
        text: "func `(replaceTopLevel|\\(\\*Client\\)\\.SetSocialDates)`"
      # Only handlers read request bodies, and respond.go is where they do it.
      - path-except: internal/httpapi/
        linters:
          - forbidigo
      - path: internal/httpapi/respond\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports

version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    # Holds the line at today's most similar code (dupl, 200 tokens); tighten it over time.
    - dupl
    - errorlint
    # Keeps request bodies read in one place: httpapi's respond.go (see the exclusions below).
    - forbidigo
    # Holds the line at today's longest function (SetSocialDates, 76 lines / 51 statements); tighten it over time.
    - funlen
    # Cognitive complexity (branches weighted by how deeply they nest) over 15, the same limit fallow sets for
    # the TypeScript apps. The functions already over it are listed at the end of the exclusions; split one
    # to take its line off, and don't add new ones.
    - gocognit
    - gocritic
    # Holds the line at today's most complex function (replaceTopLevel, complexity 24); tighten it over time.
    - gocyclo
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    forbidigo:
      forbid:
        - pattern: ^json\.NewDecoder$
          msg: "Read a request's JSON body with withBody, withGitHubBody or decodeEntryUpTo from respond.go."
    dupl:
      threshold: 200
    funlen:
      lines: 80
      statements: 55
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 25
  exclusions:
    rules:
      # Tests are long tables of cases; their length and branching are not what these linters guard against.
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - gocyclo
          - forbidigo
      # Only handlers read request bodies, and respond.go is where they do it.
      - path-except: internal/httpapi/
        linters:
          - forbidigo
      - path: internal/httpapi/respond\.go
        linters:
          - forbidigo
      # Over gocognit's limit when it was added, with each one's complexity at the time.
      - { path: internal/github/backfill\.go, linters: [gocognit], text: "\\.PreviewBackfill`" } # 16
      - { path: internal/github/backfill\.go, linters: [gocognit], text: "`findPlans`" } # 21
      - { path: internal/github/backfill\.go, linters: [gocognit], text: "`objectGaps`" } # 19
      - { path: internal/github/baseurl\.go, linters: [gocognit], text: "`imageStrings`" } # 27
      - { path: internal/github/baseurl\.go, linters: [gocognit], text: "`origins`" } # 17
      - { path: internal/github/catchup\.go, linters: [gocognit], text: "\\.catchUp`" } # 17
      - { path: internal/github/photobooks\.go, linters: [gocognit], text: "`validPhotoBookPage`" } # 17
      - { path: internal/github/photogroups\.go, linters: [gocognit], text: "\\.AddPhotoGroups`" } # 17
      - { path: internal/github/social\.go, linters: [gocognit], text: "\\.SetSocialDates`" } # 36
      - { path: internal/github/social\.go, linters: [gocognit], text: "`replaceTopLevel`" } # 43
      - { path: internal/httpapi/photo\.go, linters: [gocognit], text: "`receivePhoto`" } # 19
      - { path: internal/storage/upload\.go, linters: [gocognit], text: "`uploadPhoto`" } # 17
      - { path: internal/transit/osmrail_routes\.go, linters: [gocognit], text: "\\.add`" } # 16

formatters:
  enable:
    - gofmt
    - goimports

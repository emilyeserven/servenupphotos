version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    # Holds the line at today's most similar code (dupl, 200 tokens); tighten it over time.
    - dupl
    - errorlint
    # Holds the line at today's longest function (SetSocialDates, 76 lines / 51 statements); tighten it over time.
    - funlen
    - gocritic
    # Holds the line at today's most complex function (replaceTopLevel, complexity 24); tighten it over time.
    - gocyclo
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    dupl:
      threshold: 200
    funlen:
      lines: 80
      statements: 55
    gocyclo:
      min-complexity: 25
  exclusions:
    rules:
      # Tests are long tables of cases; their length and branching are not what these linters guard against.
      - path: _test\.go
        linters:
          - funlen
          - gocyclo

formatters:
  enable:
    - gofmt
    - goimports

# Dependabot opens one pull request a week per ecosystem with every minor and patch update grouped
# together, so small updates are reviewed in one go. Major updates stay in their own pull requests.
# The npm versions mostly live in the `catalog:` of pnpm-workspace.yaml, which Dependabot updates too.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Update"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/apps/be-pipeline"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Update"
    groups:
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Update"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/apps/be-pipeline"
      - "/apps/bff-pipeline"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Update"

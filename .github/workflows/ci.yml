name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On pull requests, skips the jobs whose files didn't change. A skipped job
  # still counts as passing for required checks. Pushes to main run both.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      go: ${{ steps.filter.outputs.go }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # A file counts only if it matches every pattern of a filter.
          predicate-quantifier: every
          filters: |
            typescript:
              # oxfmt also checks the YAML, JSON and Markdown in be-pipeline,
              # so only its Go files are left out.
              - '**'
              - '!apps/be-pipeline/**/*.go'
              - '!apps/be-pipeline/go.{mod,sum}'
            go:
              # One pattern, since a file has to match all of them. The oxfmt
              # config and lockfile are here because the Go tests check the
              # pipeline's JSON against oxfmt.
              - '{apps/be-pipeline/**,.github/workflows/ci.yml,.oxfmtrc.json,pnpm-lock.yaml}'
            workflows:
              - '.github/**'

  typescript:
    name: TypeScript (lint, format, typecheck, fallow)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: oxlint
        run: pnpm lint
      - name: oxfmt
        run: pnpm fmt:check
      - name: typecheck
        run: pnpm typecheck
      - name: fallow
        run: pnpm fallow
      - name: fixtures
        run: pnpm check:fixtures
      # bff-pipeline's build is the same tsc pass as its typecheck, so only
      # the Vite apps are built.
      - name: build
        run: pnpm --filter @servenup/portfolio --filter @servenup/client-pipeline build
      - name: tests
        run: pnpm test

  go:
    name: Go (be-pipeline)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/be-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/be-pipeline/go.mod
          cache-dependency-path: apps/be-pipeline/go.mod
      # The Go tests run the repository's oxfmt on the JSON the pipeline
      # commits, so a photo data pull request can't fail the format check.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: apps/be-pipeline
      # The race detector catches data races in the backend's concurrent R2 and GitHub reads (internal/throttle, memo, progress).
      # versions and storage start no goroutines of their own, but their tests encode real WEBP and AVIF
      # files, which the race detector slows about twentyfold (over two minutes instead of five seconds),
      # so they run without it.
      - name: go test
        run: |
          mapfile -t raced < <(go list ./... | grep -v -e '/internal/versions$' -e '/internal/storage$')
          go test -race "${raced[@]}"
          go test ./internal/versions/ ./internal/storage/
        env:
          # Fail, rather than skip, the oxfmt comparison if oxfmt is missing.
          REQUIRE_OXFMT: "1"
      - run: go build ./...

  workflows:
    name: Workflows (actionlint)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The image bundles shellcheck and pyflakes, so the run: blocks are
      # checked too.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

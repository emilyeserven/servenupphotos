name: Deploy portfolio

on:
  push:
    branches: [main]
    paths:
      - apps/portfolio/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-portfolio.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @servenup/portfolio...
      # The map's place pages and their preview images (docs/map-link-previews.md). The cache
      # keeps drawn images and CARTO's tiles between deploys, so only changed views are drawn.
      - uses: actions/cache@v6
        with:
          path: apps/portfolio/node_modules/.cache/map-previews
          key: map-previews-${{ github.run_id }}
          restore-keys: map-previews-
      - run: pnpm --filter @servenup/portfolio build
        env:
          MAP_PREVIEWS: "1"
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

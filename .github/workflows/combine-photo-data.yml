name: Combine photo data

# Rebuilds the combined lists in apps/portfolio/src/data on the branch it's
# started on, committed back to that branch: photos/ALLPHOTOS.json,
# albums/ALLALBUMS.json, tags/ALLTAGS.json, places/PLACES.json,
# localizations/LOCALIZATIONS.json, metainfo/METAINFO.json and cameras/CAMERAS.json, each every other JSON file in
# its folder as one array sorted by file name. Photos without a title are drafts and are left out
# of ALLPHOTOS.json, unless include_untitled is checked (see docs/drafts.md). The pipeline's Commit button
# does the same itself (CommitCombined in apps/be-pipeline), with the same
# commit message, so this only runs when started by hand from the Actions
# tab, as a fallback.

on:
  workflow_dispatch:
    inputs:
      include_untitled:
        description: Put photos without a title in ALLPHOTOS.json too, instead of keeping them as drafts
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: combine-photo-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combine:
    name: Combine photo, album and tag data
    # Never commits to the default branch: it rebuilds a pull request's branch
    # before it merges.
    if: github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      DATA_DIR: apps/portfolio/src/data
      HEAD_REF: ${{ github.ref_name }}
      INCLUDE_UNTITLED: ${{ inputs.include_untitled }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Combine JSON files
        run: |
          # combine FOLDER FILE [FILTER]: every JSON file directly in FOLDER except FILE, as one
          # array in FILE, through the jq FILTER when one is given.
          combine() {
            local dir="$DATA_DIR/$1" out="$DATA_DIR/$1/$2" filter="${3:-.}"
            mkdir -p "$dir"
            mapfile -t files < <(
              find "$dir" -maxdepth 1 -type f -name '*.json' ! -name "$2" | LC_ALL=C sort
            )
            if [ "${#files[@]}" -eq 0 ]; then
              echo '[]' > "$out"
            else
              jq -s "$filter" "${files[@]}" > "$out"
            fi
            pnpm exec oxfmt "$out"
            echo "Combined ${#files[@]} file(s) into $out"
          }
          drafts='map(select((.title | type) == "string" and (.title | test("\\S"))))'
          if [ "$INCLUDE_UNTITLED" = "true" ]; then drafts='.'; fi
          combine photos ALLPHOTOS.json "$drafts"
          combine albums ALLALBUMS.json
          combine tags ALLTAGS.json
          combine places PLACES.json
          combine localizations LOCALIZATIONS.json
          combine metainfo METAINFO.json
          combine cameras CAMERAS.json
      - name: Commit the combined files
        run: |
          git add "$DATA_DIR/photos/ALLPHOTOS.json" "$DATA_DIR/albums/ALLALBUMS.json" "$DATA_DIR/tags/ALLTAGS.json" \
            "$DATA_DIR/places/PLACES.json" "$DATA_DIR/localizations/LOCALIZATIONS.json" "$DATA_DIR/metainfo/METAINFO.json" \
            "$DATA_DIR/cameras/CAMERAS.json"
          if git diff --cached --quiet; then
            echo "The combined files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Combine photo, album and tag data"
          git push origin "HEAD:$HEAD_REF"

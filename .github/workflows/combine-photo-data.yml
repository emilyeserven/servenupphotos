name: Combine photo data

# Rebuilds the combined lists in apps/portfolio/src/data on "Add photo data"
# pull requests, committed back to the pull request: photos/ALLPHOTOS.json,
# albums/ALLALBUMS.json and tags/ALLTAGS.json, each every other JSON file in
# its folder as one array sorted by file name.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - apps/portfolio/src/data/**

permissions:
  contents: write

concurrency:
  group: combine-photo-data-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  combine:
    name: Combine photo, album and tag data
    # The pipeline opens these pull requests from branches in this repository,
    # so the job can push back to them.
    if: >-
      github.event.pull_request.title == 'Add photo data' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DATA_DIR: apps/portfolio/src/data
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Combine JSON files
        run: |
          # combine FOLDER FILE: every JSON file directly in FOLDER except FILE, as one array in FILE.
          combine() {
            local dir="$DATA_DIR/$1" out="$DATA_DIR/$1/$2"
            mkdir -p "$dir"
            mapfile -t files < <(
              find "$dir" -maxdepth 1 -type f -name '*.json' ! -name "$2" | LC_ALL=C sort
            )
            if [ "${#files[@]}" -eq 0 ]; then
              echo '[]' > "$out"
            else
              jq -s '.' "${files[@]}" > "$out"
            fi
            pnpm exec oxfmt "$out"
            echo "Combined ${#files[@]} file(s) into $out"
          }
          combine photos ALLPHOTOS.json
          combine albums ALLALBUMS.json
          combine tags ALLTAGS.json
      - name: Commit the combined files
        run: |
          git add "$DATA_DIR/photos/ALLPHOTOS.json" "$DATA_DIR/albums/ALLALBUMS.json" "$DATA_DIR/tags/ALLTAGS.json"
          if git diff --cached --quiet; then
            echo "The combined files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Combine photo, album and tag data"
          git push origin "HEAD:$HEAD_REF"

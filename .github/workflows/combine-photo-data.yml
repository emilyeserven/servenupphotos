name: Combine photo data

# Rebuilds the combined lists in apps/portfolio/src/data on the branch it's
# started on, committed back to that branch: one per kind listed in
# scripts/data-kinds.json (photos/ALLPHOTOS.json, albums/ALLALBUMS.json, ...,
# gear/GEAR.json), each every other JSON file in its folder as one array sorted by file name. Photos without a title, or set aside as Undecided, are drafts and are left out
# of ALLPHOTOS.json, unless include_untitled is checked (see docs/drafts.md); unselected photos always are (see docs/compare-groups.md), and so are casual photos (see docs/trip-pages.md). The pipeline's Commit button
# does the same itself (CommitCombined in apps/be-pipeline), and also bakes
# triplines/TRIPLINES.geo.json and triplines/TRIPPAGES.json, which this leaves as they are, with the same
# commit message, so this only runs when started by hand from the Actions
# tab, as a fallback.

on:
  workflow_dispatch:
    inputs:
      include_untitled:
        description: Put photos without a title in ALLPHOTOS.json too, instead of keeping them as drafts
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: combine-photo-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combine:
    name: Combine photo, album and tag data
    # Never commits to the default branch: it rebuilds a pull request's branch
    # before it merges.
    if: github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      DATA_DIR: apps/portfolio/src/data
      HEAD_REF: ${{ github.ref_name }}
      INCLUDE_UNTITLED: ${{ inputs.include_untitled }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Combine JSON files
        run: |
          # combine FOLDER FILE [FILTER]: every JSON file directly in FOLDER except FILE, as one
          # array in FILE, through the jq FILTER when one is given.
          combine() {
            local dir="$DATA_DIR/$1" out="$DATA_DIR/$1/$2" filter="${3:-.}"
            mkdir -p "$dir"
            mapfile -t files < <(
              find "$dir" -maxdepth 1 -type f -name '*.json' ! -name "$2" ! -name '*.geo.json' ! -name 'TRIPPAGES.json' | LC_ALL=C sort
            )
            if [ "${#files[@]}" -eq 0 ]; then
              echo '[]' > "$out"
            else
              jq -s "$filter" "${files[@]}" > "$out"
            fi
            pnpm exec oxfmt "$out"
            echo "Combined ${#files[@]} file(s) into $out"
          }
          drafts='map(select((.title | type) == "string" and (.title | test("\\S")) and .undecided != true) | select((.unselected | type) != "object" and .casual != true))'
          if [ "$INCLUDE_UNTITLED" = "true" ]; then drafts='map(select((.unselected | type) != "object" and .casual != true))'; fi
          # Every kind in scripts/data-kinds.json, as "folder file"; photos go through drafts.
          mapfile -t kinds < <(jq -r '.[] | "\(.folder) \(.all)"' scripts/data-kinds.json)
          for kind in "${kinds[@]}"; do
            read -r folder all <<< "$kind"
            if [ "$folder" = photos ]; then combine "$folder" "$all" "$drafts"; else combine "$folder" "$all"; fi
          done
      - name: Commit the combined files
        run: |
          # Each kind's combined file, from scripts/data-kinds.json.
          mapfile -t combined < <(jq -r --arg dir "$DATA_DIR" '.[] | "\($dir)/\(.folder)/\(.all)"' scripts/data-kinds.json)
          git add "${combined[@]}"
          if git diff --cached --quiet; then
            echo "The combined files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Combine photo, album and tag data"
          git push origin "HEAD:$HEAD_REF"
